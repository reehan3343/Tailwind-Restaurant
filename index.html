<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tailwind Restaurant</title>
    <!-- Tab Icon -->
    <link rel="icon" href="images/tab_icon.png" type="png">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kurale&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body style="font-family: 'Kurale', sans-serif;">
    <!-- Navigation Start -->
    <nav class="bg-white fixed top-0 left-0 w-[100%] z-[2] lg:px-[200px] md:px-[40px] px-[10px] py-4 flex justify-between items-center shadow-lg">
        <div class="logo"><img src="images/nav_logo.png" class="w-[100%]" alt=""></div>
        <ul class="links lg:flex hidden">
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">HOME</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">ABOUT</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">SERVICE</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">MENU</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">CHEF</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">RESERVATION</a></li>
            <li class="me-3"><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">GALLERY</a></li>
            <li><a href="#" class="text-[14px] duration-300 hover:text-[#2e3192]">CONTACT</a></li>
        </ul>
        <div class="button lg:hidden inline">
            <a href="#" class="border-2 border-[#2e3192] rounded px-[9px] py-[2px]"><i class="fa fa-bars" aria-hidden="true"></i></a>
        </div>
    </nav>
    <!-- Navigation End -->


    <!-- Header Start -->
    <header>
        <div class="wrapper relative">
            <div class="image h-screen"><img src="images/header.jpg" class="object-cover h-[100%] w-[100%]" alt=""></div>
            <div class="texts">
                
            </div>
        </div>
    </header>
    <!-- Header End -->
</body>
</html>
